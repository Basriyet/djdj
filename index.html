<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mystic Valley - Fantastik RPG Çiftlik Oyunu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a2e;
            overflow: hidden;
            touch-action: none;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        #gameCanvas {
            display: block;
            background: #2d5016;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .ui-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 10px;
            color: white;
            pointer-events: auto;
        }
        
        #healthBar {
            top: 20px;
            left: 20px;
            width: 200px;
            height: 30px;
            background: rgba(255, 0, 0, 0.3);
            border: 2px solid #ff0000;
        }
        
        #healthFill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff6600);
            width: 100%;
            transition: width 0.3s ease;
        }
        
        #manaBar {
            top: 60px;
            left: 20px;
            width: 200px;
            height: 30px;
            background: rgba(0, 0, 255, 0.3);
            border: 2px solid #0066ff;
        }
        
        #manaFill {
            height: 100%;
            background: linear-gradient(90deg, #0066ff, #00ccff);
            width: 100%;
            transition: width 0.3s ease;
        }
        
        #inventory {
            bottom: 20px;
            right: 20px;
            display: grid;
            grid-template-columns: repeat(4, 60px);
            gap: 5px;
        }
        
        .inventory-slot {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #666;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
        }
        
        .inventory-slot.active {
            border-color: #ffd700;
            box-shadow: 0 0 10px #ffd700;
        }
        
        #controls {
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
        }
        
        .control-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }
        
        #actionBtn {
            position: absolute;
            bottom: 100px;
            right: 100px;
            width: 80px;
            height: 80px;
            background: rgba(255, 215, 0, 0.8);
            border: 3px solid #ffd700;
            border-radius: 50%;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .game-title {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffd700, #ff6600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .game-subtitle {
            font-size: 1.2em;
            opacity: 0.8;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="healthBar" class="ui-panel">
                <div id="healthFill"></div>
            </div>
            
            <div id="manaBar" class="ui-panel">
                <div id="manaFill"></div>
            </div>
            
            <div id="inventory" class="ui-panel">
                <div class="inventory-slot active">🌱</div>
                <div class="inventory-slot">⚔️</div>
                <div class="inventory-slot">🧪</div>
                <div class="inventory-slot">🍞</div>
                <div class="inventory-slot">🪓</div>
                <div class="inventory-slot">⛏️</div>
                <div class="inventory-slot">🎣</div>
                <div class="inventory-slot">✨</div>
            </div>
            
            <div id="controls">
                <div></div>
                <div class="control-btn" data-direction="up">↑</div>
                <div></div>
                <div class="control-btn" data-direction="left">←</div>
                <div class="control-btn" data-direction="center">⚡</div>
                <div class="control-btn" data-direction="right">→</div>
                <div></div>
                <div class="control-btn" data-direction="down">↓</div>
                <div></div>
            </div>
            
            <div id="actionBtn">Eylem</div>
        </div>
        
        <div id="loadingScreen">
            <h1 class="game-title">Mystic Valley</h1>
            <p class="game-subtitle">Fantastik RPG Çiftlik Macerası</p>
            <div class="loading-spinner"></div>
            <p>Büyülü dünya yükleniyor...</p>
        </div>
    </div>
    
    <script src="js/game.js"></script>
    <script src="js/player.js"></script>
    <script src="js/world.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/magic.js"></script>
    <script src="js/farming.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
